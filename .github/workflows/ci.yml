name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No linter or test suite is configured yet for this project.
      # This is a syntax-check placeholder; replace with real lint/test
      # commands once they exist.
      - name: Syntax check
        run: python -m py_compile server.py
